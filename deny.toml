[advisories]
version = 2
ignore = [
    # Unmaintained but no security issues, used transitively by lapin
    "RUSTSEC-2025-0134", # rustls-pemfile - used by tcp-stream via lapin
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BlueOak-1.0.0",
    "Unicode-3.0",
    "BSL-1.0",      # Boost Software License - used by clipboard-win, error-code
    "OFL-1.1",      # SIL Open Font License - used by epaint_default_fonts
    "OpenSSL",      # OpenSSL License - used by aws-lc-sys via rustls
]
confidence-threshold = 0.8

# epaint_default_fonts uses a custom font license (Ubuntu Font License)
[[licenses.clarify]]
name = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
