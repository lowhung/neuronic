[package]
name = "neuronic"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Matthew Hounslow"]
description = "Real-time graphical visualization of Caryatid message bus flow"
license = "Apache-2.0"

[[bin]]
name = "neuronic"
path = "src/main.rs"

[dependencies]
# Core types from buswatch
buswatch-types = { version = "0.1.0", features = ["serde"] }

# GUI framework
eframe = "0.30"
egui = "0.30"
egui_graphs = "0.22"

# Graph data structure
petgraph = "0.6.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# RabbitMQ
lapin = "2"
futures-util = "0.3"
minicbor-serde = { version = "0.6", features = ["alloc"] }

# Configuration
config = "0.15"
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File dialogs
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
